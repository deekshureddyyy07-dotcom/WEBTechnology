<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your account">
    <title>Login | My Company</title>

    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height:100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        /* Header */
        header {
            padding: 24px 8%;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        header h1 {
            font-size: 25px;
            color: #4f46e5;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Main content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 20px;
        }

        section {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
        }

        h2 {
            font-size: 28px;
            line-height: 1.3;
            margin-bottom: 12px;
            color: #0f172a;
        }

        section > p {
            font-size: 14px;
            line-height: 1.7;
            color: #64748b;
            margin-bottom: 28px;
        }

        /* Form */
        fieldset {
            border: none;
            min-width: 0;
        }

        legend {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        fieldset > p {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            font-size: 15px;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* Remember me */
        fieldset > p:has(input[type="checkbox"]) {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 4px 0 24px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4f46e5;
            cursor: pointer;
        }

        fieldset > p:has(input[type="checkbox"]) label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
        }

        /* Sign-in button */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        button:active {
            transform: scale(0.99);
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 3px;
        }

        /* Account links */
        section > p:has(a) {
            margin: 22px 0 0;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            padding: 24px 20px;
            text-align: center;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }

        footer nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        footer nav a {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }

        footer small {
            color: #94a3b8;
            font-size: 12px;
        }

        /* Mobile responsive styles */
        @media (max-width: 480px) {
            header {
                padding: 20px;
            }

            header h1 {
                font-size: 22px;
            }

            main {
                padding: 28px 16px;
            }

            section {
                padding: 28px 22px;
                border-radius: 14px;
            }

            h2 {
                font-size: 24px;
            }

            footer nav {
                gap: 10px 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Company</h1>
    </header>

    <main>
        <section aria-labelledby="login-heading">
            <h2 id="login-heading">Sign in to your account</h2>

            <p>
                Welcome back! Please enter your details to continue.
            </p>

            <form action="/login" method="post">
                <fieldset>
                    <legend>Login Details</legend>

                    <p>
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        >
                    </p>

                    <p>
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="8"
                            required
                        >
                    </p>

                    <p>
                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                            value="yes"
                        >
                        <label for="remember">Remember me</label>
                    </p>

                    <p>
                        <button type="submit">Sign In</button>
                    </p>
                </fieldset>
            </form>

            <p>
                <a href="/forgot-password">Forgot your password?</a>
            </p>

            <p>
                Don't have an account?
                <a href="/register">Create one</a>
            </p>
        </section>
    </main>

    <footer>
        <nav aria-label="Footer">
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Service</a>
            <a href="/help">Help</a>
        </nav>

        <p>
            <small>&copy; 2026 My Company. All rights reserved.</small>
        </p>
    </footer>

</body>
</html>
